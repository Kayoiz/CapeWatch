name: CapeWatch robot

on:
  schedule:
    - cron: '0 6,18 * * *'   # twice a day (UTC)
  workflow_dispatch:

permissions:
  contents: write   # commit data/capewatch.json
  models: read      # GitHub Models (free tier) for the 7-language texts
  actions: write    # keep this schedule switched on (see the last step)
  issues: write     # the owner's message when the word filter replaced a text (see "Tell the owner")

concurrency:
  group: robot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the robot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CAPEWATCH_FILTER_REPORT: ${{ runner.temp }}/filter-report.md
        run: node robot/robot.mjs
      - name: Commit the data file
        run: |
          git config user.name "capewatch-robot"
          git config user.email "capewatch-robot@users.noreply.github.com"
          git add data/capewatch.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: robot check $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      # The word filter (robot/offensive.mjs) replaced a text the language model wrote: the owner gets a message (an
      # issue assigned to them, which GitHub sends by e-mail) saying which cape, which field and which word.
      - name: Tell the owner about replaced texts
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          f="$RUNNER_TEMP/filter-report.md"
          if [ ! -s "$f" ]; then echo "no text replaced"; exit 0; fi
          gh issue create --repo "${{ github.repository }}" --assignee "${{ github.repository_owner }}" \
            --title "Word filter: texts replaced ($(date -u +%Y-%m-%d))" --body-file "$f"
      # GitHub switches off scheduled workflows in a public repo after 60 days without repository activity.
      # Each run already commits the status line, and this step also re-enables the workflow through the API,
      # so the schedule stays on even if a commit ever fails.
      - name: Keep the schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/robot.yml/enable" && echo "schedule kept on"
