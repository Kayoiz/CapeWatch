  // Date and time of a full timestamp, or a dash when it is missing or malformed (never "1 Jan 1970").
  const fmtWhen = (iso) => { const d = parseISO(iso); return d ? fmtDT.format(d) : '—'; };
  // Uncertain dates: c.approx[field] = {en, he, …} holds the best estimate we have.
  // Partial dates (YYYY or YYYY-MM) are estimates too.
  const approxText = (c, f) => { const a = c.approx?.[f]; return a ? (a[lang] || a.en || a.he || '') : ''; };
  const isPartial = (v) => /^\d{4}(-\d{2})?$/.test(v || '');
  function dateOf(c, f) {
    const a = approxText(c, f);
    if (a) return t('noExact', { x: a });
    if (isPartial(c[f])) return t('noExact', { x: fmtDate(c[f]) });
    return fmtDate(c[f]);
  }
  const hasDate = (c, f) => !!(c[f] || approxText(c, f));
  function ago(iso) {
    const d = parseISO(iso); if (!d) return '—';
    const mins = Math.round((d - Date.now()) / 60000);
    if (Math.abs(mins) < 60) return rtf.format(mins, 'minute');
    const hrs = Math.round(mins / 60); if (Math.abs(hrs) < 48) return rtf.format(hrs, 'hour');
    return rtf.format(Math.round(hrs / 24), 'day');
  }
  function endOf(c) {
    // availableUntil given as a bare date means "through the end of that day" (UTC)
    const s = c.availableUntil; if (!s) return null;
    // A month or year alone means "until the end of that month/year" (UTC)
    if (/^\d{4}$/.test(s)) return new Date(Date.UTC(+s + 1, 0, 1) - 1000);
    if (/^\d{4}-\d{2}$/.test(s)) { const [y, m] = s.split('-').map(Number); return new Date(Date.UTC(y, m, 1) - 1000); }
    const d = parseISO(s); if (!d) return null;
    return /^\d{4}-\d{2}-\d{2}$/.test(s) ? new Date(d.getTime() + 86399000) : d;
  }
  const unit = (n, u) => { try { return new Intl.NumberFormat(locale, { style: 'unit', unit: u, unitDisplay: 'long' }).format(n); } catch { return n + ' ' + u + (n === 1 ? '' : 's'); } };
  function remaining(c) {
    const end = endOf(c); if (!end) return null;
    const ms = end - Date.now(); if (ms <= 0) return { text: L.AV.ended, urgent: true, ms };
    const days = Math.floor(ms / 86400000), hours = Math.floor((ms % 86400000) / 3600000);
    let text;
    if (days >= 1) text = t('left', { x: hours ? fmtList.format([unit(days, 'day'), unit(hours, 'hour')]) : unit(days, 'day') });
    else if (hours >= 1) text = t('left', { x: unit(hours, 'hour') });
    else text = t('lessHour');
    return { text, urgent: ms < 3 * 86400000, ms };
  }
  const isLive = (c) => c.availability === 'available' || c.availability === 'permanent';
  // Handed out at an in-person event that has no end date (a touring show): obtainable, but not a promotion.
  const ongoingInPerson = (c) => c.category === 'event-physical' && !c.availableUntil;
  function isNew(c) {
    const ref = parseISO(c.source === 'radar' ? c.detectedAt : c.releaseDate);
    return !!ref && (Date.now() - ref) < 14 * 86400000 && (Date.now() - ref) > -86400000;
  }

  // Texture source: Mojang's texture server by textureId; capes that never had one there
  // (temporary 2010 capes, Bedrock-only capes) carry a textureUrl to the wiki's 64×32 texture file.
  const texUrl = (id) => {
    const c = S.capes.get(id);
    // The installed app never loads wiki files: their licence is non-commercial and the app has a donate button.
    // Textures drawn by CapeWatch itself live in this repo (assets/own-capes/); the app accepts only those.
    const own = typeof c?.textureUrl === 'string' && c.textureUrl.startsWith('https://raw.githubusercontent.com/Kayoiz/CapeWatch/main/assets/own-capes/');
    return c?.textureId ? 'https://textures.minecraft.net/texture/' + c.textureId : (APP && !own ? null : c?.textureUrl || null);
  };

  // ---------- installed app ----------
  // The Windows app sets window.__CAPEWATCH_APP__ before this script and provides window.capeArt, which
  // draws the card pictures from the textures at runtime. art() returns a picture or null (and asks for it).
  const APP = !!window.__CAPEWATCH_APP__;
  const art = (id, kind) => (window.capeArt ? window.capeArt.get(id, kind, texUrl(id)) : null);

  // ---------- elytra view in the cards ----------
  // In the installed app every picture (cape and elytra) is drawn from the texture by app/shell.js (art()).
  // On the web version of this page they come from the capeImages / elytraImages collections instead.
  // A cape with no elytra picture gets no "Show elytra" button.
  const showEly = new Set();      // capes whose cards currently show the elytra
  const noElyLogged = new Set();
  function logMissingElytra() {
    if (APP || !S.loaded || !S.elyLoaded) return;   // the app draws its own pictures
    for (const id of S.capes.keys()) if (!S.elyImgs.has(id) && !noElyLogged.has(id)) {
      noElyLogged.add(id);
      console.info('[Cards] elytra: no wiki elytra image, no button for', id);
    }
  }
  // Toggle button under the picture. Swaps the picture in place on every card of that cape.
  function elytraBtn(id, c) {
    if (!S.elyImgs.has(id) && !art(id, 'elytra')) return null;
    return h('button', { class: 'btn ghost ely-btn', type: 'button', 'data-ely': id, text: t(showEly.has(id) ? 'showCape' : 'showElytra'),
      onclick: () => {
        if (showEly.has(id)) showEly.delete(id); else showEly.add(id);
        document.querySelectorAll('[data-cape="' + CSS.escape(id) + '"]').forEach((card) => {
          const old = card.querySelector('.slot');
          old.replaceChildren(...slot(id, c, false).childNodes);   // same element: a click on it is never lost
        });
        document.querySelectorAll('[data-ely="' + CSS.escape(id) + '"]').forEach((b) => { b.textContent = t(showEly.has(id) ? 'showCape' : 'showElytra'); });
      } });
  }

  // A picture the app has just drawn: put it into that cape's cards (and the open detail window) in place.
  // Rebuilding the lists for every picture (dozens of times in the first seconds) threw away the buttons
  // under the mouse, so a click that landed during a rebuild did nothing.
  function refreshPics(id) {
    const c = S.capes.get(id);
    // "Owned capes" and its "Choose capes" list (these also hold a cape the data file does not know yet)
    const op = own.players[own.current];
    document.querySelectorAll('[data-owned="' + CSS.escape(id) + '"] > .slot').forEach((el) => el.replaceChildren(...(c ? slot(id, c, false).childNodes : ownedPic(id, op?.tex[id]))));
    document.querySelectorAll('[data-pick="' + CSS.escape(id) + '"] .pick-thumb').forEach((el) => { const x = op && pickThumb(id, c, op); el.replaceChildren(...(x ? [x] : [])); });
    if (!c) return;
    document.querySelectorAll('[data-cape="' + CSS.escape(id) + '"]').forEach((card) => {
      const el = card.querySelector('.slot');
      if (!el) return;
      el.replaceChildren(...slot(id, c, false).childNodes);
      if (!card.querySelector('[data-ely]')) { const b = elytraBtn(id, c); if (b) { el.after(b); updateSoon(); } }   // a new button: sizes again
    });
    const dlg = $('dlg');
    if (dlg.open && dlg.dataset.cape === id) $('dlg-slot').replaceChildren(...slot(id, c, false).childNodes);
  }

  // ---------- pieces ----------
  // A cape with no texture anywhere (none at Mojang, none of our own): a plain cape outline, the same for each, and
  // its name. It is not a picture of the real cape.
  // A faint blocky figure seen from behind (head, arms, legs) and, clearer, the cape on its back with a light top edge.
  const CAPE_SHAPE = '<svg viewBox="0 0 16 32" aria-hidden="true"><g fill="currentColor">'
    + '<path opacity=".14" d="M4 0h8v8H4zM0 8h3v12H0zM13 8h3v12h-3zM4 24h8v8H4z"/><path opacity=".75" d="M3 8h10v1H3z"/>'
    + '<path opacity=".42" d="M3 9h9v15H3z"/><path opacity=".26" d="M12 9h1v15h-1z"/></g></svg>';
  function capeShape(c) {
    const p = h('span', { class: 'ph shape' });
    p.innerHTML = CAPE_SHAPE;   // fixed markup, nothing from the data file
    p.append(h('span', { class: 'ph-name', text: c.name }));
    return p;
  }
  function slot(id, c, interactive) {
    const ely = showEly.has(id) ? (S.elyImgs.get(id) || art(id, 'elytra')) : null;
    const gen = !S.imgs.get(id) && art(id, 'cape');
    const src = S.imgs.get(id) || gen;
    const genEly = ely && !S.elyImgs.get(id);
    const kids = [ely ? h('img', { src: ely, alt: '', class: genEly ? 'gen' : 'elytra', decoding: 'async' })
      : src ? h('img', { src, alt: '', class: gen ? 'gen' : null, loading: 'lazy', decoding: 'async' })
      : texUrl(id) ? h('span', { class: 'ph', text: c.name }) : capeShape(c)];
    if (isNew(c)) kids.push(h('span', { class: 'flag', text: 'NEW' }));
    if (!interactive) return h('div', { class: 'slot' }, kids);
    return h('button', { class: 'slot', type: 'button', 'aria-label': t('details', { n: c.name }), onclick: () => openDetail(id) }, kids);
  }
  function editions(c) {
    const e = c.editions || [];
    return [e.includes('java') ? h('span', { class: 'ed java', title: 'Java Edition', text: 'JAVA' }) : null,
            e.includes('bedrock') ? h('span', { class: 'ed bedrock', title: 'Bedrock Edition', text: 'BEDROCK' }) : null];
  }
  const pill = (c) => h('span', { class: 'pill ' + c.availability, text: L.AV[c.availability] || c.availability });
  // cost: 'free' = only a Minecraft account needed; 'paid' = needs a ticket, another game or a pre-order; unset for staff/personal capes.
  const freePill = (c) => c.cost === 'free' ? h('span', { class: 'pill free', title: t('freeTip'), text: t('free') }) : null;
  function wikiUrl(c) { return 'https://minecraft.wiki/w/' + encodeURIComponent((c.wikiTitle || c.name).replace(/ /g, '_')).replace(/%23/, '#'); }

  // "**x**" in data text marks a key fact; rendered as <strong>, everything else stays plain text.
  const rich = (s) => String(s || '').split(/\*\*(.+?)\*\*/).map((part, i) => i % 2 ? h('strong', { text: part }) : part);
  // Card text: the short summary (shortEn/shortHe), else the first sentence of the full how-to.
  const shortOf = (c) => pick(c, 'short') || (pick(c, 'obtain').match(/^.+?[.!?](?=\s|$)/) || [pick(c, 'obtain')])[0];

  // Compact card: name, badges, one countdown, one short line. Everything else lives in the detail dialog.
  function liveCard(id, c) {
    const rem = c.availability === 'available' ? remaining(c) : null;
    // <wbr>: "(estimate)" may move to the next line when the card is narrow (it used to push past the border).
    const est = (f) => approxText(c, f) ? [h('wbr'), h('span', { class: 'est', text: '(' + t('est') + ')' })] : null;
    let clock = null;
    if (rem) clock = h('div', { class: 'countdown' + (rem.urgent ? ' urgent' : ''), 'data-count': id }, rem.text, est('availableUntil'));
    else if (c.availability === 'announced' && c.availableFrom) clock = h('div', { class: 'countdown' }, t('opens', { d: fmtDate(c.availableFrom) }), est('availableFrom'));
    return h('article', { class: 'live-card', 'data-cape': id },
      h('div', { class: 'pic' }, slot(id, c, true), elytraBtn(id, c)),
      h('div', { class: 'live-body' },
        h('div', { class: 'live-name', text: c.name }),
        h('div', { class: 'meta' }, editions(c), pill(c), freePill(c)),
        clock,
        h('p', { class: 'short rich' }, rich(shortOf(c))),
        h('div', { class: 'live-actions' },
          c.availability === 'available' && hasDate(c, 'redeemBy') ? h('a', { class: 'btn', href: 'https://www.minecraft.net/redeem', target: '_blank', rel: 'noopener', text: t('redeemBtn') }) : null,
          h('button', { class: 'btn ghost', type: 'button', onclick: () => openDetail(id), text: t('more') }))));
  }

  // ---------- render ----------
  function render() {
    if (!fmtFull) return;
    const all = [...S.capes.entries()];
    // status strip
    $('st-last').textContent = S.status?.lastCheckAt ? ago(S.status.lastCheckAt) : (S.loaded ? t('notChecked') : '…');
    if (S.status?.lastCheckAt) $('st-last').title = fmtWhen(S.status.lastCheckAt);
    if (S.loaded) {
      $('st-live').textContent = all.filter(([, c]) => isLive(c)).length;   // all obtainable capes (also in-person ones); "free" is a subset
      $('st-free').textContent = all.filter(([, c]) => isLive(c) && c.cost === 'free').length;
      $('st-total').textContent = all.length;
      $('st-java').textContent = all.filter(([, c]) => (c.editions || []).includes('java')).length;
      $('st-bedrock').textContent = all.filter(([, c]) => (c.editions || []).includes('bedrock')).length;
    }

    // live now
    const live = $('live'); live.replaceChildren();
    if (S.dbMissing) live.append(h('div', { class: 'empty', text: t('dbMissing') }));
    else if (!S.loaded) live.append(h('div', { class: 'empty', text: t('loading') }));
    else {
      const now = all.filter(([, c]) => c.availability === 'available' && !ongoingInPerson(c))
        .sort((a, b) => (endOf(a[1])?.getTime() ?? Infinity) - (endOf(b[1])?.getTime() ?? Infinity));
      if (!now.length) live.append(h('div', { class: 'empty', text: t('noLive') }));
      now.forEach(([id, c]) => live.append(liveCard(id, c)));
      all.filter(([, c]) => c.availability === 'permanent').forEach(([id, c]) => live.append(liveCard(id, c)));
    }

    // announced
    const ann = all.filter(([, c]) => c.availability === 'announced');
    $('sec-ann').hidden = !ann.length;
    $('announced').replaceChildren(...ann.map(([id, c]) => liveCard(id, c)));

    renderOwned();

    // log
    const log = $('log'); log.replaceChildren();
    if (!S.events.length) log.append(h('li', {}, h('time', { text: '—' }), h('span', { class: 'muted', text: S.loaded ? t('logEmpty') : t('loadingShort') })));
    for (const e of S.events.slice(0, 10)) {
      log.append(h('li', {}, h('time', { datetime: e.at || '', text: fmtWhen(e.at) }),
        h('span', {}, h('span', { class: 'kind', text: (L.EV[e.type] || L.EV.changed) + ': ' }), pick(e, 'text') || e.capeName || '')));
    }

    renderGrid();
  }

  function renderGrid() {
    const q = $('f-q').value.trim().toLowerCase(), ed = $('f-ed').value, st = $('f-st').value, cost = $('f-cost').value, sort = $('f-sort').value;
    // category options from data, labelled in the current language
    const cats = [...new Set([...S.capes.values()].map(c => c.category).filter(Boolean))];
    const catSel = $('f-cat');
    if (catSel.options.length - 1 !== cats.length) {
      const cur = catSel.value || store.get('cat', 'all');
      catSel.replaceChildren(h('option', { value: 'all', text: t('catAll') }), ...Object.keys(T.en.CAT).filter(k => cats.includes(k)).map(k => h('option', { value: k, text: L.CAT[k] })));
      catSel.value = [...catSel.options].some(o => o.value === cur) ? cur : 'all';
    }
    const cat = catSel.value;
    let rows = [...S.capes.entries()].filter(([, c]) => {
      const e = c.editions || [], J = e.includes('java'), B = e.includes('bedrock');
      if (ed === 'java' && !J) return false; if (ed === 'bedrock' && !B) return false;
      if (ed === 'both' && !(J && B)) return false; if (ed === 'java-only' && !(J && !B)) return false; if (ed === 'bedrock-only' && !(B && !J)) return false;
      if (st === 'get' && !isLive(c)) return false; if (st !== 'all' && st !== 'get' && c.availability !== st) return false;
      if (cat !== 'all' && c.category !== cat) return false;
      if (cost !== 'all' && c.cost !== cost) return false;
      if (q && !(c.name || '').toLowerCase().includes(q)) return false;
      return true;
    });
    const key = (c) => c.releaseDate || '0000';
    rows.sort(sort === 'name' ? (a, b) => a[1].name.localeCompare(b[1].name) : sort === 'old' ? (a, b) => key(a[1]).localeCompare(key(b[1])) : (a, b) => key(b[1]).localeCompare(key(a[1])));
    $('count-line').textContent = S.loaded ? t('count', { n: rows.length, t: S.capes.size }) : '';
    const grid = $('grid');
    if (!S.loaded) { grid.replaceChildren(h('div', { class: 'empty', text: S.dbMissing ? t('gridMissing') : t('loadingShort') })); return; }
    if (!rows.length) { grid.replaceChildren(h('div', { class: 'empty', text: t('gridEmpty') })); return; }
    grid.replaceChildren(...rows.map(([id, c]) => h('div', { class: 'tile', 'data-cape': id },
      slot(id, c, true),
      elytraBtn(id, c),
      h('div', { class: 'tile-name', text: c.name }),
      h('div', { class: 'meta' }, editions(c), pill(c), freePill(c)),
      h('div', { class: 'date', text: dateOf(c, 'releaseDate') }))));
  }

  // ---------- header title ----------
  // The title is CapeWatch's own title art (assets/brand/title-*.png, transparent, made for a dark background).
  // (The id "leaf-title" is left from the first title, drawn in code from leaf blocks; it is the same element.)
  const titleView = (() => {
    const MAX_W = 640;
    const img = $('leaf-title'), bar = $('titlebar'), tools = $('title-tools');
    // Width: as wide as the free space allows (never over the language picker), at most MAX_W; on narrow
    // windows the picker has its own row and the title takes the full width. srcset picks a sharp file.
    let lastW = 0;
    function draw() {
      const narrow = matchMedia('(max-width: 720px)').matches;
      const avail = narrow ? bar.clientWidth : bar.clientWidth - 2 * (tools.offsetWidth + 12);
      const w = Math.max(120, Math.floor(Math.min(MAX_W, avail)));
      if (w === lastW) return;
      lastW = w;
      img.style.width = w + 'px';
      img.sizes = w + 'px';
    }
    const ro = new ResizeObserver(draw);
    ro.observe(bar); ro.observe(tools);
    draw();

    // ---------- opening glow ----------
    // When the window is opened, the title art itself glows for a moment: it brightens and a soft green halo
    // rises around its outline, then it goes back to normal (timing in assets/title-fx.js). Only the image's filter changes, so
    // it ends exactly as it was. "Reduce animations" in Windows: no glow. In the app the shell decides when to
    // play it (only when the user opens the window, never on a start with Windows); on the web page it plays
    // once on load.
    // The effect itself (timeline, glow, keyframes, blocks, defaults) lives in assets/title-fx.js, shared with
    // tools/tune-title.html. It draws on a canvas laid over the image while it plays, then the image is back.
    const FX = window.CapeWatchFX;
    let fx = null, run = 0;
    // fixed: the overlay never adds scrollbars when blocks fly past the window edge
    const fxNew = () => { if (!fx && FX) fx = FX.createTitleFx(img, FX.SCENE, { fixed: true }); return fx; };
    const fxEnd = () => { if (fx) { fx.destroy(); fx = null; } };
    function fxFrame(t) { if (t == null) return fxEnd(); const f = fxNew(); if (f && f.renderAt(t)) f.show(true); }
    async function glow() {
      if (!FX) { console.info('[Title] glow: skipped (assets/title-fx.js missing)'); return false; }
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) { console.info('[Title] glow: skipped (reduce animations is on)'); return false; }
      const me = ++run; fxEnd();
      try { await img.decode(); } catch {}                 // play over the picture, not an empty box
      if (me !== run) return false;
      console.info('[Title] glow: start');
      fxNew().play({ onEnd: ({ frames, ms, worst }) => {
        fxEnd();
        console.info('[Title] glow: ' + frames + ' frames in ' + Math.round(ms) + 'ms, ' + (frames * 1000 / ms).toFixed(1) + ' fps, slowest frame ' + Math.round(worst) + 'ms');
      } });
      return true;
    }
    if (!APP) glow();
    // introAt(t) shows one moment of the glow (for checking stills); introAt(null) removes it.
    return { draw, glow, introAt: (t) => { run++; if (fx) fx.stop(); fxFrame(t); } };
  })();

  // ---------- opening sound ----------
  // The chord itself (synthesised in code, no sound file) lives in assets/title-fx.js, shared with tools/tune-title.html.
  function holyChord() {
    if (!window.CapeWatchFX) { console.info('[Sound] skipped: assets/title-fx.js missing'); return false; }
    const state = window.CapeWatchFX.playSound(window.CapeWatchFX.SCENE);   // at its place on the effect's timeline
    console.info('[Sound] holy chord: ' + state);
    return state === 'running' || state === 'scheduled';
  }

  // ---------- header 3D view (skinview3d, vendored in vendor/skinview3d/) ----------
  // One WebGL view only (browsers cap live WebGL contexts): my skin, seen from straight behind,
  // static, wearing a cloth cape. Cape textures are fetched at runtime from textures.minecraft.net
  // and kept in memory only; they are never written to the project.

  const cape3d = (() => {
    const TAG = '[Cape3D]';
    const SKIN_URL = 'assets/skin/Kayskin.png';
    const SWAP_MS = 5000;                 // every 5 s: a cape, then its elytra, then the next cape, looping through all
    const STRIPS = 8, STRIP_H = 2;         // 8 strips × 2 px = the cape's 16 px height, folds fall between pixels
    // Wind: each hinge adds its own angle, so lower strips lean further. Degrees / seconds / radians per strip.
    const WIND = { base: 2.2, amp: 1.6, period: 1.8, delay: 0.5, grow: 0.12 };
    // Camera (default view; the user can turn and zoom it, see "turning the figure by hand"): straight behind, raised 15° and looking down a little like the game's
    // F5 view, with game-like perspective so the cape's thickness, its gap from the back and the lifting hem
    // show. The distance is fitted to the drawn model, so head to feet and the whole cape always fit.
    const CAM = { fov: 50, elevation: 15, fill: 0.94 };
    // Elytra: after each cape, its elytra for one turn (drawn from the elytra part of the same texture).
    // Both wings open and close together, slowly and only a little (z rotation only). Degrees / seconds.
    // The right wing sits slightly further from the camera: at equal depth the overlap flickers (z-fighting).
    const ELYTRA = { base: 15, amp: 4, period: 3.2, behind: 0.2 };
    const log = (...a) => console.info(TAG, ...a);
    const err = (...a) => console.error(TAG, ...a);
    const since = (t0) => Math.round(performance.now() - t0) + 'ms';
    let viewer = null, started = false, frames = 0;
    let pos = -1, current = null, busy = false, mode = 'cape';
    const skipped = new Set();
    const hasElytra = new Map();   // cape id -> whether its texture has an elytra part
    const hinges = [];

    // Same face layout as skinview3d's setCapeUVs (64×32 texture), but for one 2 px band of rows.
    // The cape's real top/bottom edge rows go on the first strip's top and the last strip's bottom.
    // Inner seam faces peek out when a strip tilts, so they take the outside row next to them
    // (mirrored in x, because the -z face runs right-to-left), which keeps the seams invisible.
    function stripUVs(geom, i) {
      const W = 64, H = 32, w = 10, h = STRIP_H, d = 1, v = i * STRIP_H;
      const f = (x1, y1, x2, y2) => [[x1 / W, 1 - y2 / H], [x2 / W, 1 - y2 / H], [x2 / W, 1 - y1 / H], [x1 / W, 1 - y1 / H]];
      const outsideRow = (y) => f(w * 2 + d * 2, y, w + d * 2, y + 1);
      const faces = [
        [f(w + d, v + d, w + d * 2, v + h + d), [3, 2, 0, 1]],          // right
        [f(0, v + d, d, v + d + h), [3, 2, 0, 1]],                      // left
        [i === 0 ? f(d, 0, w + d, d) : outsideRow(v + d), [3, 2, 0, 1]],                          // top
        [i === STRIPS - 1 ? f(w + d, 0, w * 2 + d, d) : outsideRow(v + d + h - 1), [0, 1, 3, 2]], // bottom
        [f(d, v + d, w + d, v + d + h), [3, 2, 0, 1]],                  // front (+z, inside of the cape)
        [f(w + d * 2, v + d, w * 2 + d * 2, v + h + d), [3, 2, 0, 1]]   // back (-z, outside of the cape)
      ];
      const uv = [];
      for (const [face, order] of faces) for (const k of order) uv.push(...face[k]);
      geom.attributes.uv.set(new Float32Array(uv));
      geom.attributes.uv.needsUpdate = true;
    }

    // Swap the rigid cape box for a chain of strips. Each hinge sits on the top edge of its strip and is
    // a child of the one above, so the angles add up and the cloth folds. The built-in cape group keeps
    // its place on the back and its rest angle, and supplies the shared material (and so the texture).
    function buildCloth() {
      const capeGroup = viewer.playerObject.cape;
      const rigid = capeGroup.cape;
      const Mesh = rigid.constructor, Box = rigid.geometry.constructor;
      const Group = Object.getPrototypeOf(skinview3d.CapeObject);   // CapeObject extends THREE.Group
      rigid.visible = false;
      let parent = capeGroup;
      for (let i = 0; i < STRIPS; i++) {
        const hinge = new Group();
        hinge.position.y = i === 0 ? 0 : -STRIP_H;
        const geom = new Box(10, STRIP_H, 1);
        stripUVs(geom, i);
        const strip = new Mesh(geom, capeGroup.material);
        strip.position.set(0, -STRIP_H / 2, 0.5);
        hinge.add(strip);
        parent.add(hinge);
        hinges.push(hinge);
        parent = hinge;
      }
    }

    // Constant wind: a sine that reaches each strip a little later than the one above it.
    // The lean never changes sign, so the cape only moves back and forth, never into the body or sideways.
    // Negative x = away from the back: the cape group is turned 180° about y, which flips its local x axis.
    function wind(t) {
      const w = 2 * Math.PI / WIND.period, rad = Math.PI / 180;
      for (let i = 0; i < hinges.length; i++) {
        hinges[i].rotation.x = -(1 + WIND.grow * i) * (WIND.base + WIND.amp * Math.sin(w * t - i * WIND.delay)) * rad;
      }
    }

    // Minecraft-style entity light: a dim ambient plus two lights from above (one behind, one in front),
    // so every cape strip shades by its angle and the folds read as depth. Far point lights with no
    // falloff act as the game's directional lights. Intensities are the game's 0.4 / 0.6 in three.js units.
    function gameLight() {
      const Light = viewer.cameraLight.constructor;
      viewer.globalLight.intensity = 0.4 * Math.PI;
      viewer.cameraLight.intensity = 0;
      for (const [x, y, z] of [[0.2, 1, -0.7], [-0.2, 1, 0.7]]) {
        const l = new Light(0xffffff, 0.6 * Math.PI, 0, 0);
        l.position.set(x * 1000, y * 1000, z * 1000);
        viewer.scene.add(l);
      }
    }

    // Screen extents (-1..1) of every visible part of the player as the camera sees it now.
    function extents() {
      const cam = viewer.camera, b = { x0: 1, x1: -1, y0: 1, y1: -1 };
      viewer.scene.updateMatrixWorld(true);
      cam.updateMatrixWorld();
      viewer.playerObject.traverseVisible((o) => {
        if (!o.isMesh) return;
        const pos = o.geometry.attributes.position, p = o.position.clone();
        for (let i = 0; i < pos.count; i++) {
          p.fromBufferAttribute(pos, i); o.localToWorld(p); p.project(cam);
          b.x0 = Math.min(b.x0, p.x); b.x1 = Math.max(b.x1, p.x); b.y0 = Math.min(b.y0, p.y); b.y1 = Math.max(b.y1, p.y);
        }
      });
      return b;
    }

    // Straight behind and 15° up; pull back and re-center until the whole drawn player fills the view.
    // One camera for both turns: the fit covers the cape and the elytra at its widest opening together,
    // so nothing is cut and the view never jumps between a cape and its elytra.
    function placeCamera() {
      const p = viewer.playerObject, was = [p.cape.visible, p.elytra.visible];
      p.cape.visible = p.elytra.visible = true;
      setWings(ELYTRA.base + ELYTRA.amp);
      fitCamera();
      [p.cape.visible, p.elytra.visible] = was;
    }
    function fitCamera() {
      const cam = viewer.camera, tan = Math.tan((cam.fov / 2) * Math.PI / 180), e = CAM.elevation * Math.PI / 180;
      cam.updateProjectionMatrix();
      let dist = 17 / tan, y = 0;
      for (let k = 0; k < 6; k++) {
        cam.position.set(0, y + dist * Math.sin(e), -dist * Math.cos(e));
        cam.lookAt(0, y, 0);
        const b = extents();
        dist *= Math.max(b.x1 - b.x0, b.y1 - b.y0) / 2 / CAM.fill;
        y += (b.y1 + b.y0) / 2 * tan * dist * 0.9;
      }
      cam.position.set(0, y + dist * Math.sin(e), -dist * Math.cos(e));
      cam.lookAt(0, y, 0);
      viewer.controls.target.set(0, y, 0);
      base = { dist, y };
      applyView();
    }

    // ---------- turning the figure by hand ----------
    // Drag: turn freely sideways (360°), up and down only within limits so it never flips over. Let go: it keeps
    // turning a little and slows to a stop (not with "reduce animations"), then stays at that angle. Wheel: zoom,
    // limited so the camera never goes inside the figure or loses it. Reset (button or double-click): smoothly
    // back to the view from behind at the normal size. The camera orbits the fitted framing (base), so the cape
    // rotation, the cloth and the skin are untouched.
    const VIEW = { pitchMin: -25, pitchMax: 55, zoomMin: 0.6, zoomMax: 2.5, dragDeg: 0.45, friction: 4.5, wheel: 0.0015, resetMs: 520 };
    let base = null;
    const view = { yaw: 0, pitch: 0, zoom: 1 };            // degrees, degrees (added to the 15° elevation), factor
    let zoomGoal = 1, spin = { yaw: 0, pitch: 0 }, anim = 0, resetting = null;
    let invertDrag = false;                                 // the app's "reverse drag direction" setting (sideways only)
    const reducedMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
    // While the window is hidden (tray, minimized) nothing is drawn and the capes do not swap: no work at all
    // for days in the background. Back on screen, it goes on from the cape it stopped at.
    let shown = true;
    function setVisible(v, why) {
      if (!viewer || v === shown) return;
      shown = v; viewer.renderPaused = !v;
      log('view: ' + (v ? 'running' : 'paused') + ' (' + why + ')');
      if (v && started && !current) next();   // hidden since the start: put the first cape on at once
    }
    function applyView() {
      if (!base || !viewer) return;
      const cam = viewer.camera, r = base.dist / view.zoom;
      const yaw = view.yaw * Math.PI / 180, el = (CAM.elevation + view.pitch) * Math.PI / 180;
      cam.position.set(r * Math.cos(el) * Math.sin(yaw), base.y + r * Math.sin(el), -r * Math.cos(el) * Math.cos(yaw));
      cam.lookAt(0, base.y, 0);
    }
    const clampPitch = (p) => Math.max(VIEW.pitchMin, Math.min(VIEW.pitchMax, p));
    // one small loop, running only while something moves (spin after letting go, zoom easing, reset)
    function tick(now) {
      anim = 0;
      const dt = Math.min(0.05, (now - (tick.last || now)) / 1000); tick.last = now;
      let moving = false;
      if (resetting) {
        const u = Math.min(1, (now - resetting.t0) / VIEW.resetMs), e = u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
        view.yaw = resetting.yaw * (1 - e); view.pitch = resetting.pitch * (1 - e); view.zoom = resetting.zoom + (1 - resetting.zoom) * e;
        if (u >= 1) { resetting = null; view.yaw = view.pitch = 0; view.zoom = zoomGoal = 1; } else moving = true;
      } else {
        if (Math.abs(spin.yaw) > 2 || Math.abs(spin.pitch) > 2) {              // degrees per second
          view.yaw = (view.yaw + spin.yaw * dt) % 360; view.pitch = clampPitch(view.pitch + spin.pitch * dt);
          const k = Math.exp(-VIEW.friction * dt); spin.yaw *= k; spin.pitch *= k; moving = true;
        } else spin.yaw = spin.pitch = 0;
        if (Math.abs(zoomGoal - view.zoom) > 0.001) { view.zoom += (zoomGoal - view.zoom) * Math.min(1, dt * 14); moving = true; }
        else view.zoom = zoomGoal;
      }
      applyView();
      if (moving) anim = requestAnimationFrame(tick); else tick.last = 0;
    }
    const kick = () => { if (!anim) anim = requestAnimationFrame(tick); };
    function resetView() {
      spin = { yaw: 0, pitch: 0 };
      const yaw = ((view.yaw % 360) + 540) % 360 - 180;                     // the short way round
      resetting = { t0: performance.now(), yaw, pitch: view.pitch, zoom: view.zoom };
      zoomGoal = 1; kick(); log('view: reset');
    }
    function setupOrbit() {
      const canvas = $('cape3d'), box = $('logo');
      let drag = null;
      canvas.addEventListener('pointerdown', (e) => {
        if (e.button !== 0) return;
        canvas.setPointerCapture(e.pointerId);
        resetting = null; spin = { yaw: 0, pitch: 0 };
        drag = { x: e.clientX, y: e.clientY, t: e.timeStamp, vy: 0, vp: 0 };
        box.classList.add('dragging');
      });
      canvas.addEventListener('pointermove', (e) => {
        if (!drag) return;
        const dx = e.clientX - drag.x, dy = e.clientY - drag.y, dt = Math.max(1, e.timeStamp - drag.t) / 1000;
        // sideways: the figure turns with the hand, like grabbing it (reversed with the setting)
        const dyaw = (invertDrag ? -dx : dx) * VIEW.dragDeg, dpitch = dy * VIEW.dragDeg;
        view.yaw = (view.yaw + dyaw) % 360; view.pitch = clampPitch(view.pitch + dpitch);
        // smoothed speed, for the spin after letting go
        drag.vy = drag.vy * 0.6 + (dyaw / dt) * 0.4; drag.vp = drag.vp * 0.6 + (dpitch / dt) * 0.4;
        drag.x = e.clientX; drag.y = e.clientY; drag.t = e.timeStamp;
        applyView();
      });
      const end = (e) => {
        if (!drag) return;
        const still = e.timeStamp - drag.t > 90;                            // held still before letting go: no spin
        if (!reducedMotion() && !still) { spin = { yaw: Math.max(-900, Math.min(900, drag.vy)), pitch: Math.max(-400, Math.min(400, drag.vp)) }; kick(); }
        drag = null; box.classList.remove('dragging');
      };
      canvas.addEventListener('pointerup', end);
      canvas.addEventListener('pointercancel', end);
      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();                                                 // zoom the figure, not the page
        resetting = null;
        zoomGoal = Math.max(VIEW.zoomMin, Math.min(VIEW.zoomMax, zoomGoal * Math.exp(-e.deltaY * VIEW.wheel)));
        kick();
      }, { passive: false });
      canvas.addEventListener('dblclick', resetView);
      $('view-reset').addEventListener('click', resetView);
      // Nothing to draw while the window is hidden or minimized: stop rendering until it is back. In a browser the
      // page knows (visibilitychange); in the app the window tells it (setVisible, from app/shell.js).
      document.addEventListener('visibilitychange', () => setVisible(!document.hidden, 'page'));
    }

    async function loadSkin() {
      const t0 = performance.now();
      log('skin: loading', SKIN_URL);
      try {
        await viewer.loadSkin(SKIN_URL, { model: 'auto-detect' });
        log('skin: loaded in', since(t0), 'model=' + viewer.playerObject.skin.modelType);
        placeCamera();   // slim and classic arms differ in width
      } catch (e) { err('skin: failed', SKIN_URL, e?.message || e?.type || e); }
    }

    // Rotation order: obtainable capes first, then newest release first. Capes without any texture are
    // skipped and logged once each. Rebuilt every swap, so capes the radar adds later join the cycle.
    function capeOrder() {
      const all = [...S.capes.entries()];
      for (const [id] of all) if (!texUrl(id) && !skipped.has(id)) { skipped.add(id); log('cape: no texture, skipped', id); }
      return all.filter(([id]) => texUrl(id))
        .sort(([, a], [, b]) => (isLive(b) - isLive(a)) || String(b.releaseDate || '').localeCompare(String(a.releaseDate || '')))
        .map(([id]) => id);
    }

    // Warm the browser's memory cache with the next texture so the swap itself is instant.
    function preload(id) { const img = new Image(); img.crossOrigin = 'anonymous'; img.src = texUrl(id); }

    // Both wings at the same angle in the same frame; the library mirrors the right wing from the left.
    function setWings(deg) {
      const el = viewer.playerObject.elytra;
      el.leftWing.rotation.z = deg * Math.PI / 180;
      el.updateRightWing();
    }
    function wings(t) {
      if (viewer.playerObject.elytra.visible) setWings(ELYTRA.base + ELYTRA.amp * Math.sin(2 * Math.PI * t / ELYTRA.period));
    }

    // The elytra part of a cape texture is x 22–45, y 0–21 (64×32 layout). Read it from the library's own
    // copy of the loaded texture: any visible pixel there means the cape has an elytra.
    function elytraIn(id) {
      if (hasElytra.has(id)) return hasElytra.get(id);
      let found = false;
      try {
        const cv = viewer.capeCanvas, k = cv.width / 64;
        const px = cv.getContext('2d', { willReadFrequently: true }).getImageData(22 * k, 0, 24 * k, 22 * k).data;
        for (let i = 3; i < px.length; i += 4) if (px[i] > 0) { found = true; break; }
      } catch (e) { err('elytra: could not read texture', id, e?.message || e); }
      hasElytra.set(id, found);
      if (!found) log('elytra: no elytra part in texture, skipped', id);
      return found;
    }

    async function next() {
      if (!shown) return;                                               // hidden: no swap (see setVisible)
      if (busy) { log('swap: previous load still running, tick skipped'); return; }
      busy = true;
      try {
        // Second turn of a cape: its elytra, same texture, nothing to load.
        if (mode === 'cape' && current && hasElytra.get(current)) {
          viewer.playerObject.backEquipment = 'elytra';
          mode = 'elytra';
          log('swap:', current + ' cape -> ' + current + ' elytra');
          return;
        }
        const order = capeOrder();
        if (!order.length) { err('swap: no capes with a texture'); return; }
        // Continue after the cape on screen even if the list changed (a cape added, a status changed).
        // If that cape left the list, the ones after it moved up by one.
        const at = current ? order.indexOf(current) : -1;
        if (at >= 0) pos = at; else if (current) pos -= 1;
        for (let tries = 0; tries < order.length; tries++) {
          pos = (pos + 1 + order.length) % order.length;
          const id = order[pos];
          if (await loadCape(id)) {
            log('swap:', (current ? current + ' ' + mode : '-') + ' -> ' + id + ' cape', '(' + (pos + 1) + '/' + order.length + ')');
            current = id;
            mode = 'cape';
            elytraIn(id);
            preload(order[(pos + 1) % order.length]);
            return;
          }
        }
        err('swap: every cape failed to load');
      } finally { busy = false; }
    }

    async function loadCape(id) {
      const url = texUrl(id);
      if (!url) { log('cape: no texture, skipped', id); return false; }
      const t0 = performance.now();
      log('cape: loading', id, url);
      try {
        await viewer.loadCape(url, { makeVisible: false });
        viewer.playerObject.backEquipment = 'cape';
        log('cape: loaded', id, 'in', since(t0));
        return true;
      } catch (e) { err('cape: failed', id, url, e?.message || e?.type || e); return false; }
    }

    function init() {
      if (!window.skinview3d) { err('library missing: vendor/skinview3d/skinview3d.bundle.js did not load'); return; }
      const box = $('logo');
      try {
        // Supersample: at screen resolution the hem only travels ~3 px, so it hops between whole pixel rows
        // and looks jerky. Drawing at 4× and letting the browser scale it down blends the in-between positions.
        viewer = new skinview3d.SkinViewer({ canvas: $('cape3d'), width: box.clientWidth, height: box.clientHeight,
          enableControls: false, fov: CAM.fov, pixelRatio: 4 });
      } catch (e) { err('view: WebGL could not start', e?.message || e); return; }
      $('cape3d').addEventListener('webglcontextlost', () => err('view: WebGL context lost'));
      $('cape3d').addEventListener('webglcontextrestored', () => log('view: WebGL context restored'));
      buildCloth();
      gameLight();
      viewer.playerObject.elytra.rightWing.position.z = ELYTRA.behind;   // never updated by updateRightWing
      placeCamera();
      setupOrbit();
      // The frame's height follows the title block (language, window width), so keep the view matched to it.
      new ResizeObserver(() => {
        const w = box.clientWidth, h = box.clientHeight;
        if (!w || !h || (w === viewer.width && h === viewer.height)) return;
        viewer.width = w; viewer.height = h;
        placeCamera();
        log('view: resized', w + 'x' + h);
      }).observe(box);
      // Hook the library's own render call: advance the wind, count frames.
      const render = viewer.render.bind(viewer);
      viewer.render = () => { const t = performance.now() / 1000; wind(t); wings(t); frames++; render(); };
      setInterval(() => { if (shown) log('fps', (frames / 5).toFixed(1)); frames = 0; }, 5000);   // nothing to count while hidden
      log('view: ready', viewer.width + 'x' + viewer.height, 'pixelRatio=' + viewer.renderer.getPixelRatio(),
        'webgl2=' + viewer.renderer.capabilities.isWebGL2, 'strips=' + STRIPS);
      loadSkin();
    }

    window.addEventListener('error', (e) => { if (String(e.filename || '').includes('skinview3d')) err('script error', e.message); });
    init();
    return {
      // Called on every capes snapshot; the rotation starts once and then reads the latest list each swap.
      onCapes() {
        if (!viewer || started) return;
        started = true;
        next();
        setInterval(next, SWAP_MS);
        log('swap: rotation started, every', SWAP_MS / 1000 + 's');
      },
      get viewer() { return viewer; },
      // The app tells the view when its window is hidden in the tray or minimized (see app/shell.js).
      setVisible: (v) => setVisible(v, 'window ' + (v ? 'shown' : 'hidden or minimized')),
      // The app's "reverse drag direction" setting: dragging sideways turns the figure the other way.
      setInvertDrag(on) { invertDrag = !!on; log('view: drag direction ' + (invertDrag ? 'reversed' : 'normal')); },
      // Swap the figure's skin (the app's "my skin" setting); back to the default skin when url is empty.
      async setSkin(url) {
        try { await viewer.loadSkin(url || SKIN_URL, { model: 'auto-detect' }); placeCamera(); log('skin: set', url || SKIN_URL); return true; }
        catch (e) { err('skin: failed', url, e?.message || e); return false; }
      }
    };
  })();

  // ---------- detail ----------
  function openDetail(id) {
    const c = S.capes.get(id); if (!c) return;
    const dlg = $('dlg');
    dlg.dataset.cape = id;
    fillDetail(id, c);
    if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
    // the same size in every language (see lockLayout)
    lockLayout($('dlg-inner'), (l) => { useLang(l); fillDetail(id, c); textDir(dlg, l); });
    // Opens at the top, with the focus on ✕ (autofocus): a window taller than the screen is never opened half-way down.
    dlg.scrollTop = 0;
  }
  function fillDetail(id, c) {
    $('dlg-slot').replaceChildren(...slot(id, c, false).childNodes);
    $('dlg-title').textContent = c.name;
    // replaceChildren() prints a null as the text "null", so drop the empty badges (e.g. no "free" badge on a paid cape)
    $('dlg-meta').replaceChildren(...[...editions(c), pill(c), freePill(c),
      c.category ? h('span', { class: 'pill ended', text: L.CAT[c.category] || c.category }) : null].filter(Boolean));
    $('dlg-how').replaceChildren(...rich(pick(c, 'obtain')));
    const facts = [[t('fReleased'), dateOf(c, 'releaseDate')]];
    if (hasDate(c, 'availableFrom')) facts.push([t('fFrom'), dateOf(c, 'availableFrom')]);
    if (hasDate(c, 'availableUntil')) facts.push([t('fUntil'), dateOf(c, 'availableUntil')]);
    const rem = c.availability === 'available' ? remaining(c) : null;
    if (rem) facts.push([t('fRemaining'), rem.text]);
    if (hasDate(c, 'redeemBy')) facts.push([t('fRedeem'), dateOf(c, 'redeemBy')]);
    if (c.cost) facts.push([t('fCost'), c.cost === 'free' ? t('freeTip') : t('paid')]);
    if (c.apiAlias) facts.push([t('fApi'), c.apiAlias]);
    if (c.source === 'radar' && c.detectedAt) facts.push([t('fDetected'), fmtWhen(c.detectedAt)]);
    $('dlg-facts').replaceChildren(...facts.flatMap(([k, v]) => [h('dt', { text: k }), h('dd', { text: v })]));
    $('dlg-actions').replaceChildren(h('a', { class: 'btn', href: wikiUrl(c), target: '_blank', rel: 'noopener', text: t('wikiPage') }));
  }
  $('dlg-close').addEventListener('click', () => $('dlg').close?.() ?? $('dlg').removeAttribute('open'));
  $('dlg').addEventListener('click', (e) => { if (e.target === $('dlg')) $('dlg').close(); });

  // ---------- owned capes ----------
  // A player's capes by Minecraft name, in the installed app (the lookups go through app/shell.js; the web page
  // cannot reach Mojang). Mojang tells only which cape a player is wearing right now, and capes.me which capes it
  // has seen them wear before. Those join the list by themselves (a cape someone wears is a cape they own), and the
  // rest are ticked by hand in "Choose capes". Kept on this computer only, per player id (a name can change):
  //   own = { current: id, players: { id: { name, skin, worn, tex: { 'tex:<hash>': url }, show: [keys], hide: [keys], seen, at } } }
  // A key is a cape id from the data file, or 'tex:<texture hash>' for a cape the data file does not know (yet).
  // "hide" remembers the capes taken off the list by hand, so a cape seen on the player does not come back by itself.
  // "seen": what capes.me said last time (found, unknown or failed), for the line under the list.
  const ownShell = () => (typeof window.CapeWatchShell?.player === 'function' ? window.CapeWatchShell : null);
  const OWN_NAME = /^[A-Za-z0-9_]{1,16}$/;
  const TEX = 'https://textures.minecraft.net/texture/';
  const SEEN_STATES = ['found', 'unknown', 'failed'];
  function loadOwn() {
    const out = { current: null, players: {} };
    let v = null; try { v = JSON.parse(store.get('owned', 'null')); } catch { v = null; }
    if (!v || typeof v !== 'object' || !v.players || typeof v.players !== 'object') return out;
    const keys = (a) => (Array.isArray(a) ? a.filter((x) => typeof x === 'string' && x.length < 80).slice(0, 500) : []);
    for (const [id, p] of Object.entries(v.players)) {
      if (!/^[0-9a-f]{32}$/.test(id) || !p || typeof p.name !== 'string' || !OWN_NAME.test(p.name)) continue;
      const tex = {};
      for (const k of Object.keys(p.tex && typeof p.tex === 'object' ? p.tex : {})) if (/^tex:[0-9a-f]{1,64}$/.test(k)) tex[k] = TEX + k.slice(4);
      out.players[id] = { name: p.name, skin: typeof p.skin === 'string' && /^https:\/\/textures\.minecraft\.net\/texture\/[0-9a-f]{1,64}$/.test(p.skin) ? p.skin : null,
        worn: typeof p.worn === 'string' && p.worn.length < 80 ? p.worn : null, tex, show: keys(p.show), hide: keys(p.hide),
        seen: SEEN_STATES.includes(p.seen) ? p.seen : null, at: typeof p.at === 'number' ? p.at : 0 };
    }
    if (out.players[v.current]) out.current = v.current;
    return out;
  }
  let own = loadOwn();
  const saveOwn = () => store.set('owned', JSON.stringify(own));
  let ownNote = null, ownBusy = false, ownChecked = false;   // ownNote: a passing message { key, vars, bad }
  const capeByTexture = (hash) => { for (const [id, c] of S.capes) if (typeof c.textureId === 'string' && c.textureId.toLowerCase() === hash) return id; return null; };
  // A cape the data file did not know when it was seen, and knows now, is shown as that cape.
  const ownKey = (k) => (k.startsWith('tex:') ? capeByTexture(k.slice(4)) || k : k);
  // A message with {name} / {cape} as separate pieces: a name stays left to right in every language. A piece can
  // also be an element of its own (a link).
  const tNodes = (k, vars = {}) => t(k).split(/(\{\w+\})/).filter(Boolean).map((x) => {
    const m = /^\{(\w+)\}$/.exec(x), v = m ? vars[m[1]] : null;
    return v == null ? x : v instanceof Node ? v : h('bdi', { class: 'nm', text: String(v) });
  });

  // The player's face from their skin: the front of the head, the hat layer over it. Drawn once per skin.
  const heads = new Map(), headsAsked = new Set();   // skin address -> picture (data URL) or null (could not be drawn)
  function drawHead(url) {
    const done = () => document.querySelectorAll('span.o-head[data-skin="' + CSS.escape(url) + '"]').forEach((el) => {
      const src = heads.get(url);
      if (src) el.replaceWith(h('img', { class: 'o-head', src, alt: '', width: '32', height: '32' })); else el.remove();
    });
    const img = new Image(); img.crossOrigin = 'anonymous';
    img.onload = () => {
      try {
        const cv = document.createElement('canvas'); cv.width = cv.height = 8;
        const g = cv.getContext('2d', { willReadFrequently: true });
        g.fillStyle = '#000'; g.fillRect(0, 0, 8, 8);   // the face itself is never see-through in the game
        g.drawImage(img, 8, 8, 8, 8, 0, 0, 8, 8);
        // The hat layer. Old 64x32 skins often painted it solid all over: the game leaves such a one out.
        const hat = document.createElement('canvas'); hat.width = hat.height = 8;
        const hg = hat.getContext('2d', { willReadFrequently: true }); hg.drawImage(img, 40, 8, 8, 8, 0, 0, 8, 8);
        const a = hg.getImageData(0, 0, 8, 8).data; let clear = false;
        for (let i = 3; i < a.length; i += 4) if (a[i] < 255) { clear = true; break; }
        if (clear || img.naturalHeight >= 64) g.drawImage(hat, 0, 0);
        heads.set(url, cv.toDataURL('image/png'));
      } catch { heads.set(url, null); }
      done();
    };
    img.onerror = () => { heads.set(url, null); done(); };
    img.src = url;
  }
  function headEl(p) {
    if (!p.skin) return null;
    if (!headsAsked.has(p.skin)) { headsAsked.add(p.skin); drawHead(p.skin); }
    if (!heads.has(p.skin)) return h('span', { class: 'o-head', 'data-skin': p.skin, 'aria-hidden': 'true' });   // keeps its place while drawing
    const src = heads.get(p.skin);
    return src ? h('img', { class: 'o-head', src, alt: '', width: '32', height: '32' }) : null;
  }

  function wornText(p) {
    const k = p.worn ? ownKey(p.worn) : null, c = k && S.capes.get(k);
    return !k ? tNodes('oNoCape', { name: p.name }) : c ? tNodes('oWearing', { name: p.name, cape: c.name }) : tNodes('oWearingUnknown', { name: p.name });
  }
  // The capes on the list: the one being worn first, then the newest first.
  function ownedKeys(p) {
    const worn = p.worn ? ownKey(p.worn) : null, date = (k) => S.capes.get(k)?.releaseDate || '';
    return [...new Set(p.show.map(ownKey))].filter((k) => S.capes.has(k) || p.tex[k])
      .sort((a, b) => (b === worn) - (a === worn) || date(b).localeCompare(date(a)) || a.localeCompare(b));
  }
  const ownedPic = (k, url) => { const src = url ? window.capeArt?.get(k, 'cape', url) : null; return [src ? h('img', { src, alt: '', class: 'gen', decoding: 'async' }) : h('span', { class: 'ph', text: t('unknownCape') })]; };
  function ownedTile(p, k) {
    const c = S.capes.get(k), worn = !!p.worn && ownKey(p.worn) === k;
    return h('li', { class: 'o-tile', 'data-owned': k },
      c ? slot(k, c, true) : h('div', { class: 'slot' }, ownedPic(k, p.tex[k])),
      h('div', { class: c ? 'o-name latin' : 'o-name', text: c ? c.name : t('unknownCape') }),
      worn ? h('span', { class: 'pill wearing', text: t('wearing') }) : null);
  }
  function renderOwned() {
    const shell = ownShell();
    $('sec-owned').hidden = !shell;
    if (!shell) return;
    const p = own.players[own.current] || null;
    $('o-choose').disabled = !p || !S.loaded;
    const note = $('o-note');
    note.classList.toggle('bad', !!ownNote?.bad);
    note.replaceChildren(...(ownNote ? [h('span', { class: 'o-text' }, tNodes(ownNote.key, ownNote.vars))] : []));
    // whose capes are on the list, and the one they are wearing (stays while another name is looked up or not found)
    $('o-msg').replaceChildren(...(p && S.loaded ? [headEl(p), h('span', { class: 'o-text' }, wornText(p))].filter(Boolean) : []));
    // under the list: where its capes come from (with a link to the player on capes.me), or why some may be missing
    const src = p && S.loaded ? { found: 'oSeenFound', unknown: 'oSeenUnknown', failed: 'oSeenFailed' }[p.seen] : null;
    $('o-src').replaceChildren(...(src ? tNodes(src, { name: p.name, site: h('a', { class: 'nm', href: 'https://capes.me/' + encodeURIComponent(p.name), target: '_blank', rel: 'noopener', text: 'capes.me' }) }) : []));
    const box = $('owned');
    if (!p) { box.replaceChildren(h('div', { class: 'empty', text: t('oStart') })); return; }
    if (!S.loaded) { box.replaceChildren(h('div', { class: 'empty', text: t('loadingShort') })); return; }
    const keys = ownedKeys(p);
    box.replaceChildren(keys.length ? h('ul', { class: 'o-grid' }, keys.map((k) => ownedTile(p, k))) : h('div', { class: 'empty' }, tNodes('oEmpty', { name: p.name })));
  }
  // The result, said once to screen readers (the visible line is rebuilt on every layout pass, so it is not the live region).
  function announceOwn() {
    const live = $('o-live'), said = $('o-note').textContent.trim() || [$('o-msg'), $('o-src')].map((e) => e.textContent.trim()).filter(Boolean).join(' ');
    live.textContent = '';
    if (said) setTimeout(() => { live.textContent = said; }, 60);
  }
  // A cape seen on a player joins their list, unless it is on it already or was taken off it by hand.
  function addShown(p, k) {
    k = ownKey(k);
    if (p.show.some((x) => ownKey(x) === k) || p.hide.some((x) => ownKey(x) === k)) return false;
    p.show.push(k); return true;
  }
  // What Mojang said about a player, kept: their name now, skin, and the cape being worn, which joins the list
  // unless it was taken off the list by hand. At most 100 players are kept (the ones looked at longest ago go first).
  function keepPlayer(r) {
    const p = own.players[r.id] ||= { name: r.name, skin: null, worn: null, tex: {}, show: [], hide: [], at: 0 };
    if (r.name) p.name = r.name;
    p.skin = r.skin || null; p.at = Date.now();
    const hash = r.cape ? r.cape.slice(r.cape.lastIndexOf('/') + 1).toLowerCase() : null, id = hash ? capeByTexture(hash) : null;
    p.worn = id || (hash ? 'tex:' + hash : null);
    if (p.worn && !id) p.tex[p.worn] = TEX + hash;
    if (p.worn) addShown(p, p.worn);
    const ids = Object.keys(own.players);
    if (ids.length > 100) for (const old of ids.filter((x) => x !== r.id && x !== own.current).sort((a, b) => own.players[a].at - own.players[b].at).slice(0, ids.length - 100)) delete own.players[old];
    return { id, hash };
  }
  // What capes.me said about a player, kept: every cape it has seen them wear joins the list like the one being worn
  // (known by any of its textures; one the data file does not know is kept by its texture). quiet: the check at
  // start, which keeps the last answer when capes.me does not answer. Returns how many capes joined.
  function keepSeen(id, s, quiet) {
    const p = own.players[id];
    if (!p || !SEEN_STATES.includes(s?.state) || (quiet && s.state === 'failed')) return 0;
    p.seen = s.state;
    let added = 0;
    for (const tex of Array.isArray(s.capes) ? s.capes : []) {
      const hashes = (Array.isArray(tex) ? tex : []).map((u) => /^https:\/\/textures\.minecraft\.net\/texture\/([0-9a-f]{1,64})$/i.exec(String(u))?.[1].toLowerCase()).filter(Boolean);
      if (!hashes.length) continue;
      const cape = hashes.map(capeByTexture).find(Boolean), k = cape || 'tex:' + hashes[0];
      if (!cape) p.tex[k] = TEX + hashes[0];
      if (addShown(p, k)) added++;
    }
    return added;
  }
  // "Show capes": look a player up by name (Mojang, then capes.me) and show their capes.
  async function lookUp(name) {
    const shell = ownShell(), input = $('o-name');
    if (!shell || ownBusy) return;
    name = String(name ?? '').trim();
    if (!OWN_NAME.test(name)) {
      ownNote = { key: 'oInvalid', bad: true }; input.setAttribute('aria-invalid', 'true');
      update(); announceOwn(); return;
    }
    ownBusy = true; $('owned').setAttribute('aria-busy', 'true');
    ownNote = { key: 'oLooking', vars: { name } }; update();
    try {
      const r = await shell.player(name);
      const s = typeof shell.capesSeen === 'function' ? await shell.capesSeen(r.id, r.name) : null;
      const { id, hash } = keepPlayer(r), added = keepSeen(r.id, s);
      own.current = r.id; saveOwn();
      ownNote = null; input.value = r.name; input.removeAttribute('aria-invalid');
      console.info('[Owned] ' + r.name + ': ' + (id ? 'wearing ' + id : hash ? 'wearing a cape the data file does not know' : 'no cape on')
        + (s ? '; capes.me: ' + s.state + (added ? ', ' + added + ' capes added' : '') : ''));
    } catch (e) {
      ownNote = { key: { notfound: 'oNotFound', invalid: 'oInvalid', rate: 'oRate' }[e?.code] || 'oOffline', vars: { name }, bad: true };
      if (e?.code === 'notfound' || e?.code === 'invalid') input.setAttribute('aria-invalid', 'true');
      console.info('[Owned] ' + name + ': ' + (e?.message || e));
    } finally { ownBusy = false; $('owned').removeAttribute('aria-busy'); }
    update(); announceOwn();
  }
  // At start: the player shown last time is checked once more, by id, since the cape they wear (or their name, or
  // what capes.me has seen) may have changed. Quietly: no message, the player shown does not change, and
  // "Show capes" never waits for it.
  function checkOwnedAgain() {
    const shell = ownShell(), id = own.current;
    if (ownChecked || typeof shell?.playerById !== 'function' || !own.players[id]) return;
    ownChecked = true;
    setTimeout(async () => {
      const before = own.players[id]?.name;
      try {
        const r = await shell.playerById(id, before);
        const s = typeof shell.capesSeen === 'function' ? await shell.capesSeen(id, r.name) : null;
        keepPlayer(r); keepSeen(id, s, true); saveOwn();
      } catch (e) { console.info('[Owned] check at start: ' + (e?.message || e)); return; }
      const now = own.players[id]?.name;
      if (now !== before && $('o-name').value === before) $('o-name').value = now;   // a new name
      console.info('[Owned] ' + now + ': checked again at start');
      update();
    }, 2500);
  }
  $('owned-form').addEventListener('submit', (e) => { e.preventDefault(); lookUp($('o-name').value); });
  $('o-name').addEventListener('input', () => {
    $('o-name').removeAttribute('aria-invalid');
    if (ownNote?.bad) { ownNote = null; update(); }   // a correction clears the error
  });

  // ---------- choose capes ----------
  // Every cape in the data file (and the ones seen on the player that it does not know), with a box to tick. A
  // change is kept at once; the list on the page is drawn again when the window closes.
  let pickTimer = 0;
  function pickThumb(k, c, p) {
    const src = c ? (S.imgs.get(k) || art(k, 'cape')) : (p.tex[k] ? window.capeArt?.get(k, 'cape', p.tex[k]) : null);
    if (src) return h('img', { src, alt: '', decoding: 'async' });
    if (c && !texUrl(k)) { const x = h('span'); x.innerHTML = CAPE_SHAPE; return x.firstChild; }   // no texture anywhere: the plain outline
    return null;
  }
  function pickRow(p, k, c, on, worn) {
    const box = h('input', { type: 'checkbox', class: 'cw-box', value: k, checked: on });
    box.addEventListener('change', () => setOwned(k, box.checked));
    return h('li', { 'data-pick': k }, h('label', { class: 'cw-opt pick-row' }, box,
      h('span', { class: 'pick-thumb', 'aria-hidden': 'true' }, pickThumb(k, c, p)),
      h('span', { class: 'pick-text' },
        h('span', { class: c ? 'pick-name latin' : 'pick-name', text: c ? c.name : t('unknownCape') }),
        h('span', { class: 'meta' }, c ? editions(c) : null, worn ? h('span', { class: 'pill wearing', text: t('wearing') }) : null))));
  }
  function fillPick() {
    const p = own.players[own.current]; if (!p) return;
    $('pick').querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
    $('pick-close').setAttribute('aria-label', t('close'));
    $('pick-title').replaceChildren(...tNodes('pickTitle', { name: p.name }));
    const q = $('pick-q').value.trim().toLowerCase(), shown = new Set(p.show.map(ownKey)), worn = p.worn ? ownKey(p.worn) : null;
    const unknown = [...new Set([worn, ...p.show.map(ownKey), ...p.hide.map(ownKey)])].filter((k) => k && !S.capes.has(k) && p.tex[k]);   // the one being worn first
    const rows = [...unknown.map((k) => [k, null]), ...[...S.capes.entries()].sort((a, b) => a[1].name.localeCompare(b[1].name))]
      .filter(([, c]) => !q || (c ? c.name : t('unknownCape')).toLowerCase().includes(q));
    $('pick-list').replaceChildren(...(rows.length ? rows.map(([k, c]) => pickRow(p, k, c, shown.has(k), k === worn)) : [h('li', { class: 'pick-none', text: t('pickNone') })]));
  }
  const lockPick = () => lockLayout($('pick-inner'), (l) => { useLang(l); fillPick(); textDir($('pick'), l); });
  function setOwned(k, on) {
    const p = own.players[own.current]; if (!p) return;
    const same = (x) => ownKey(x) === k;
    p.show = p.show.filter((x) => !same(x)); p.hide = p.hide.filter((x) => !same(x));
    (on ? p.show : p.hide).push(k);
    saveOwn();
  }
  function openPicker() {
    if (!own.players[own.current] || !S.loaded) return;
    const d = $('pick');
    $('pick-q').value = '';
    fillPick();
    if (typeof d.showModal === 'function') d.showModal(); else d.setAttribute('open', '');
    lockPick();
    $('pick-list').scrollTop = 0;
  }
  $('o-choose').addEventListener('click', openPicker);
  $('pick-q').addEventListener('input', () => { clearTimeout(pickTimer); pickTimer = setTimeout(() => { fillPick(); lockPick(); }, 150); });
  for (const id of ['pick-done', 'pick-close']) $(id).addEventListener('click', () => $('pick').close());
  $('pick').addEventListener('click', (e) => { if (e.target === $('pick')) $('pick').close(); });
  $('pick').addEventListener('close', () => { clearTimeout(pickTimer); update(); $('o-choose').focus(); });

  // ---------- filters & language ----------
  for (const [id, key] of [['f-ed', 'ed'], ['f-st', 'st'], ['f-cost', 'cost'], ['f-sort', 'sort'], ['f-cat', 'cat']]) {
    const el = $(id); const saved = store.get(key, null);
    if (saved && [...el.options].some(o => o.value === saved)) el.value = saved;
    el.addEventListener('change', () => { store.set(key, el.value); update(); });
  }
  $('f-q').addEventListener('input', update);
  // Keyboard vs mouse, for the menus' focus ring (see the CSS above).
  addEventListener('keydown', () => { document.documentElement.dataset.kbd = ''; }, true);
  addEventListener('pointerdown', () => { delete document.documentElement.dataset.kbd; }, true);
  const langSel = $('f-lang');
  langSel.replaceChildren(...Object.entries(LANGS).map(([k, v]) => h('option', { value: k, lang: k, text: v.name })));
  langSel.addEventListener('change', () => { store.set('lang', langSel.value); setLang(langSel.value); });

  // Countdowns and "last check" tick locally, no writes. Only those texts change, in place: rebuilding the
  // cards every minute would drop keyboard focus and re-decode every picture.
  function tick() {
    if (!S.loaded) return;
    if (S.status?.lastCheckAt) $('st-last').textContent = ago(S.status.lastCheckAt);
    document.querySelectorAll('[data-count]').forEach((el) => {
      const c = S.capes.get(el.dataset.count), rem = c && remaining(c);
      if (!rem) return;
      el.firstChild.nodeValue = rem.text;
      el.classList.toggle('urgent', rem.urgent);
    });
  }
  setInterval(tick, 60000);

  const savedLang = store.get('lang', null);
  setLang(savedLang && LANGS[savedLang] ? savedLang : detectLang());
  if (ownShell()) $('o-name').value = own.players[own.current]?.name || ownShell().skinName?.() || '';

  // ---------- data ----------
  // Several collections answer within the same moment on load; render once for all of them.
  let renderTimer = 0;
  const requestRender = () => { if (!renderTimer) renderTimer = setTimeout(() => { renderTimer = 0; update(); }, 16); };
  addEventListener('capeart', (e) => (e.detail ? refreshPics(e.detail) : requestRender()));   // a drawn picture is ready
  window.CapeWatchPage = { cape3d, lang: () => lang, t, openDetail: (id) => openDetail(id), lockLayout, textDir, langs: Object.keys(LANGS), glow: () => titleView.glow(), glowAt: (t) => titleView.introAt(t), holyChord };
  (async () => {
    let db = null;
    try { db = await window.claude?.use?.('db'); } catch { db = null; }
    if (!db) { S.dbMissing = true; render(); return; }
    const onErr = () => { S.dbMissing = !S.loaded; render(); };
    db.collection('capes').limit(1000).onSnapshot((snap) => {
      S.capes = new Map(snap.docs.map(d => [d.id, d.data()]).filter(([, c]) => c && c.name));
      S.loaded = true; requestRender();
      logMissingElytra();
      cape3d.onCapes();
      checkOwnedAgain();
    }, onErr);
    db.collection('capeImages').limit(1000).onSnapshot((snap) => {
      S.imgs = new Map(snap.docs.map(d => [d.id, d.data()?.src]).filter(([, s]) => typeof s === 'string' && s.startsWith('data:image/')));
      requestRender();
    }, () => {});
    db.collection('elytraImages').limit(1000).onSnapshot((snap) => {
      S.elyImgs = new Map(snap.docs.map(d => [d.id, d.data()?.src]).filter(([, s]) => typeof s === 'string' && s.startsWith('data:image/')));
      S.elyLoaded = true;
      requestRender();
      logMissingElytra();
    }, () => {});
    db.collection('events').orderBy('at', 'desc').limit(20).onSnapshot((snap) => {
      S.events = snap.docs.map(d => d.data()).filter(Boolean); requestRender();
    }, () => {});
    db.doc('radar/status').onSnapshot((snap) => { S.status = snap.exists ? snap.data() : null; requestRender(); }, () => {});
  })();
})();
</script>
