<title>CapeWatch</title>
<!-- Assistant, Pixelify Sans and Secular One ship with CapeWatch (assets/fonts/google/): no call to Google, same look offline -->
<link rel="stylesheet" href="assets/fonts/google/fonts.css">
<style>
/* Layout: one column, the same in every language: switching language never moves anything (see "the same place in
   every language" in the script). In Hebrew only the text inside each box runs right to left.
   Status strip → live promotions → radar log → full wardrobe grid of inventory slots. */
:root {
  --bg: #E6E8E1;          /* pale stone */
  --panel: #F5F6F1;
  --slot: #B4B7AE;        /* inventory slot, tinted toward moss */
  --bevel-hi: #FFFFFF;
  --bevel-lo: #5E625A;
  --fg: #1C1F1A;
  --muted: #585E54;
  --line: #CDD0C6;
  --accent: #3C8527;      /* Minecraft button green */
  --accent-fg: #FFFFFF;
  --live: #2F7A1F;
  --live-bg: #DCEFD2;
  --soon: #A3470B;
  --soon-bg: #FBE3D2;
  --announced: #8A5A00;
  --announced-bg: #F6E8C4;
  --ended: #5F645B;
  --ended-bg: #DFE1DA;
  --exclusive: #6B3FB8;   /* enchant purple */
  --exclusive-bg: #E9E0F8;
  --java: #B8641B;
  --bedrock: #2D6FA8;
  --font-display: "Secular One", "Assistant", "Arial Hebrew", system-ui, sans-serif;
  --font-body: "Assistant", "Segoe UI", "Arial Hebrew", system-ui, sans-serif;
  --font-pixel: "CapeWatch Pixel", "Pixelify Sans", "Assistant", ui-monospace, monospace;
  --step--1: .8125rem;      /* small text inside cards, badges and buttons */
  --text-sm: .875rem;       /* secondary text outside the cards (notes, labels, log times, footer) */
  --measure: 70ch;          /* longest comfortable line for running text */
  --step-0: 1rem;
  --step-1: 1.25rem;
  --step-2: 1.6rem;
  --step-3: 2.2rem;
  --title-plate: #141612;   /* light mode: the title art sits on a dark plate */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171916; --panel: #20231F; --slot: #2E322C; --bevel-hi: #4B5047; --bevel-lo: #0A0B09;
    --fg: #E8EBE3; --muted: #A2A99C; --line: #343831; --accent: #6CC349; --accent-fg: #0F1A0B;
    --live: #86D866; --live-bg: #1F3319; --soon: #FF9B5C; --soon-bg: #3A2415;
    --announced: #E9C15C; --announced-bg: #332913; --ended: #9EA497; --ended-bg: #2A2D28;
    --exclusive: #BC98FF; --exclusive-bg: #2C2140; --java: #F0A05A; --bedrock: #6FB3F0;
    --title-plate: transparent;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171916; --panel: #20231F; --slot: #2E322C; --bevel-hi: #4B5047; --bevel-lo: #0A0B09;
  --fg: #E8EBE3; --muted: #A2A99C; --line: #343831; --accent: #6CC349; --accent-fg: #0F1A0B;
  --live: #86D866; --live-bg: #1F3319; --soon: #FF9B5C; --soon-bg: #3A2415;
  --announced: #E9C15C; --announced-bg: #332913; --ended: #9EA497; --ended-bg: #2A2D28;
  --exclusive: #BC98FF; --exclusive-bg: #2C2140; --java: #F0A05A; --bedrock: #6FB3F0;
  --title-plate: transparent;
  color-scheme: dark;
}

* { box-sizing: border-box; }
/* `hidden` must win over the display rules below (section { display: grid } kept an empty "Announced" heading) */
[hidden] { display: none !important; }
/* CapeWatch's own pixel font (tools/make-font.py): one drawn weight, so the browser never smears it into a
   fake bold. 8 pixels per em: sizes that are multiples of 8px stay sharp. */
@font-face { font-family: "CapeWatch Pixel"; src: url("assets/fonts/CapeWatchPixel.ttf") format("truetype"); font-weight: 100 900; font-display: swap; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: var(--step-0); line-height: 1.55; }
.wrap { max-width: 1120px; margin-inline: auto; padding-inline: 16px; padding-block: 28px 56px; display: grid; gap: 40px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; line-height: 1.2; margin: 0; text-wrap: balance; }
h1 { font-size: var(--step-3); }
h2 { font-size: var(--step-2); }
h3 { font-size: var(--step-1); }
p { margin: 0; }
a { color: var(--accent); }
a:focus-visible, button:focus-visible, input:focus-visible, .slot:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
/* Chrome keeps a menu's focus ring after a mouse pick, so menus show it only while the keyboard is in use */
html[data-kbd] select:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
select:focus { outline: none; }
.latin { font-family: var(--font-pixel); unicode-bidi: isolate; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.eyebrow { font-size: var(--text-sm); color: var(--muted); max-width: var(--measure); }

/* Header */
header.top { display: grid; gap: 18px; }
.brand { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
/* Logo: a static slot frame holding the one 3D view (my skin from behind, wearing a cloth cape) */
/* Fixed width; the height stretches to the title block beside it (never taller than it).
   The canvas is absolutely placed so it can't push the frame taller, and is resized from JS. */
.logo { position: relative; width: 220px; min-height: 275px; align-self: stretch; flex: none; background: var(--slot); overflow: hidden; }
@media (max-width: 520px) { .logo { width: 160px; min-height: 200px; } }   /* phones: 160 + 16 + 160 still fits 375px */
/* The figure is always on the right (the layout never mirrors, also not in Hebrew) */
.brand .logo { order: 2; margin-left: auto; }   /* auto margin: stays right even if it wraps */
.logo::after { content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
  box-shadow: inset 3px 3px 0 var(--bevel-lo), inset -3px -3px 0 var(--bevel-hi); }
.logo canvas { position: absolute; inset: 0; display: block; cursor: grab; touch-action: none; }
.logo.dragging canvas { cursor: grabbing; }
/* Reset the 3D view: small and quiet in the corner, clearer on hover and keyboard focus */
.view-reset { position: absolute; z-index: 2; top: 8px; right: 8px; width: 28px; height: 28px; padding: 0;
  display: grid; place-items: center; font: 600 15px/1 var(--font-body); color: var(--fg); background: color-mix(in srgb, var(--panel) 75%, transparent);
  border: 0; }   /* quiet (see-through) until hovered or focused: see "Controls" */
.brand-text { display: grid; gap: 4px; min-width: 0; flex: 1 1 160px; }   /* 160 + 16 + 120 fits a 375px phone */
/* Title bar: the title art centered, the language picker beside it (right in LTR, left in RTL).
   On phones the picker sits on its own row above the title. */
.titlebar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 12px; }
.leaf-title { grid-column: 2; margin: 0; line-height: 0; min-width: 0; position: relative; isolation: isolate; }
/* The title art (assets/brand/): sized by script to the free width (max 640px), sharp on any screen through
   srcset. In light mode it sits on a dark plate. The opening effect is drawn on a canvas laid over it
   (assets/title-fx.js); the image itself is never changed. */
#leaf-title { display: block; max-width: 100%; height: auto; background: var(--title-plate); border-radius: 12px; will-change: filter; }
/* The app hides the title until its opening effect starts (app/shell.js), so it never flashes plain first */
.cw-title-wait #leaf-title { visibility: hidden; }
/* Language picker and (in the app) the settings button, side by side next to the title */
.title-tools { grid-column: 3; justify-self: end; display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 8px; }
@media (max-width: 720px) {
  .titlebar { grid-template-columns: 1fr; }
  .title-tools { grid-row: 1; grid-column: 1; }
  .leaf-title { grid-column: 1; justify-self: center; }
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.lang-pick { display: flex; align-items: center; gap: 8px; font-size: var(--text-sm); color: var(--muted); }
.lede { color: var(--muted); max-width: var(--measure); }
/* Not-affiliated notice: always visible under the title */
.unofficial { justify-self: start; font-size: var(--text-sm); font-weight: 600; color: var(--announced); background: var(--announced-bg);
  padding: 4px 10px; box-shadow: inset 0 0 0 1.5px currentColor; }
footer p { max-width: var(--measure); }
/* Required notice (exact English line, translation under it); contact and donate sit next to it */
.unofficial { display: grid; gap: 2px; align-content: start; }   /* the room kept for a longer translation stays below the text */
.mojang-en { letter-spacing: .01em; unicode-bidi: plaintext; }   /* English even on a Hebrew page: the final period stays at the end */
.mojang-tr { font-weight: 400; }
.mojang-tr:empty { display: none; }
.notice-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin-top: 10px; }
.notice-row .unofficial { max-width: var(--measure); }
.foot-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.foot-actions .btn { font-size: var(--text-sm); }
footer .legal { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); }
/* Status strip: equal columns, 6 in a row; 3 + 3 on tablets, 2 × 3 on phones (wide enough for "29 hours ago") */
.status { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px 16px; padding-block: 14px; border-block: 2px solid var(--line); }
@media (max-width: 720px) { .status { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 480px) { .status { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
/* Each number and its label share two rows with the other stats in the same row (subgrid): the labels sit on one
   line, and a number that needs two lines in some language grows upward from it. */
.stat { display: grid; grid-row: span 2; grid-template-rows: subgrid; row-gap: 0; min-width: 0; }
.stat b { display: grid; align-content: end; }
.stat b { font-family: var(--font-pixel); font-size: var(--step-1); font-weight: 600; font-variant-numeric: tabular-nums; }
.stat span { font-size: var(--text-sm); color: var(--muted); line-height: 1.35; }

/* Section heads */
section { display: grid; gap: 16px; min-width: 0; }
/* Heading with its short note directly underneath (not pushed to the far side of the page) */
.sec-head { display: grid; gap: 4px; justify-items: start; }

/* Live promotions */
.live-list { display: grid; gap: 16px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 720px) { .live-list { grid-template-columns: 1fr; } }
.live-card { display: grid; grid-template-columns: 112px 1fr; gap: 16px; padding: 16px; background: var(--panel);
  box-shadow: inset 3px 3px 0 var(--bevel-hi), inset -3px -3px 0 var(--bevel-lo); min-width: 0; }
.live-card .slot { cursor: pointer; align-self: start; }
.live-body { display: grid; gap: 8px; align-content: start; min-width: 0; }
.live-name { font-family: var(--font-pixel); font-size: var(--step-1); font-weight: 600; unicode-bidi: isolate; }
.countdown { font-family: var(--font-pixel); font-size: var(--step-1); color: var(--live); font-variant-numeric: tabular-nums; }
.countdown.urgent { color: var(--soon); }
.countdown .est { font: 400 var(--step--1)/1 var(--font-body); color: var(--muted); margin-inline-start: 8px; }
/* Key facts inside how-to text (**bold** in the data) */
.rich strong { font-weight: 700; color: var(--fg); background: var(--live-bg); padding-inline: 2px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.short { font-size: var(--step-0); line-height: 1.5; }
.live-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; font: 600 var(--step--1)/1.2 var(--font-body);
  background: var(--accent); color: var(--accent-fg); text-decoration: none; border: 0; }   /* bevel, hover, press: see "Controls" */
.btn.ghost { background: transparent; color: var(--fg); }
/* Buttons and badges are as wide as their longest translation (see "the same place in every language"): the text sits
   in the middle, so a shorter word never looks pushed to one side, in either direction. */
.btn { justify-content: center; text-align: center; }
.pill, .ed { text-align: center; }
.empty { padding: 18px; color: var(--muted); background: var(--panel); border: 2px dashed var(--line); }

/* Radar log */
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.log li { display: grid; grid-template-columns: 10rem minmax(0, 1fr); gap: 16px; padding-block: 10px; border-bottom: 1px solid var(--line); min-width: 0; }
.log time { color: var(--muted); font-size: var(--text-sm); font-variant-numeric: tabular-nums; padding-top: 2px; white-space: nowrap; }
.log li > span { max-width: var(--measure); }
.log .kind { font-weight: 700; }
@media (max-width: 600px) { .log li { grid-template-columns: 1fr; gap: 2px; } }

/* Filters */
.filters { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: var(--text-sm); color: var(--muted); }
.field input, .field select, .lang-pick select { font: inherit; font-size: var(--text-sm); padding: 7px 10px; background: var(--panel); color: var(--fg);
  border: 0; --bs: inset 2px 2px 0 var(--bevel-lo), inset -2px -2px 0 var(--bevel-hi); box-shadow: var(--bs); min-width: 0; }
.field input { width: 12rem; max-width: 100%; }
/* Phones: an even 2-column grid of filters, search across the full width */
@media (max-width: 600px) {
  .filters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .filters .field:first-child { grid-column: 1 / -1; }
  .field input, .field select { width: 100%; }
}
.count-line { font-size: var(--text-sm); color: var(--muted); margin-top: -4px; }

/* Inventory grid */
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
@media (max-width: 420px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } }
.tile { display: grid; gap: 6px; align-content: start; min-width: 0; }
.slot { position: relative; aspect-ratio: 4 / 5; max-width: 100%; background: var(--slot); overflow: hidden; border: 0; padding: 0; width: 100%;
  box-shadow: inset 4px 4px 0 var(--bevel-lo), inset -4px -4px 0 var(--bevel-hi); display: grid; place-items: center; }
button.slot { cursor: pointer; }
/* The wiki renders (280x636) show a grey player model from behind wearing the cape.
   Crop to the cape itself: source x 0–200, y 250–500 fills the 4:5 slot exactly. */
.slot img { position: absolute; left: 0; top: -100%; width: 140%; max-width: none; height: auto; image-rendering: pixelated; }
/* The wiki elytra renders (438x705) show the same grey player wearing the elytra.
   Crop to the wings: source x 0–427, y 160–694 fills the 4:5 slot exactly (all 49 renders fit inside). */
.slot img.elytra { top: -30%; width: 102.5%; }
/* Pictures the installed app draws itself are already framed for the 4:5 slot */
.slot img.gen { top: 0; left: 0; width: 100%; height: 100%; }
/* Elytra toggle sits right under the picture, as wide as it */
.pic { display: grid; gap: 8px; align-content: start; min-width: 0; }
.ely-btn { justify-content: center; width: 100%; padding-inline: 6px; }
.slot .ph { font-family: var(--font-pixel); color: var(--muted); font-size: var(--step--1); text-align: center; padding: 8px; }
/* A cape with no texture anywhere: the same plain cape outline for each (not the real cape), its name under it */
.slot .ph.shape { display: grid; justify-items: center; align-content: center; gap: 8px; width: 100%; height: 100%; }
.ph.shape svg { width: 35%; height: auto; shape-rendering: crispEdges; }
.ph-name { line-height: 1.25; overflow-wrap: anywhere; unicode-bidi: isolate; }
.slot .flag { position: absolute; z-index: 1; top: 8px; left: 8px; font: 600 11px/1 var(--font-pixel); letter-spacing: .04em; padding: 4px 6px;
  background: var(--accent); color: var(--accent-fg); }
.tile-name { font-family: var(--font-pixel); font-weight: 600; font-size: 16px; unicode-bidi: isolate; overflow-wrap: anywhere; line-height: 1.25; }
.meta { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.ed { font: 600 11px/1 var(--font-pixel); padding: 3px 5px; border: 1.5px solid currentColor; }
.ed.java { color: var(--java); }
.ed.bedrock { color: var(--bedrock); }
.pill { font-size: 12px; font-weight: 700; padding: 2px 8px; line-height: 1.5; }
.pill.available, .pill.permanent { color: var(--live); background: var(--live-bg); }
.pill.announced { color: var(--announced); background: var(--announced-bg); }
.pill.ended { color: var(--ended); background: var(--ended-bg); }
.pill.exclusive { color: var(--exclusive); background: var(--exclusive-bg); }
.pill.free { color: var(--live); box-shadow: inset 0 0 0 1.5px currentColor; }
.tile .date { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Owned capes: a player's capes by Minecraft name (the installed app only). The same pieces as the rest of the
   page: the filters row, the slots, the pills. The cape being worn comes from Mojang, the capes worn before from
   capes.me, the rest the player picks. */
/* o-note: what just happened (looking up, or what went wrong); o-msg: whose capes these are and what they wear */
.o-note, .o-msg { display: flex; align-items: center; gap: 10px; margin: -4px 0 0; font-size: var(--text-sm); color: var(--muted); }
.o-note:empty, .o-msg:empty { display: none; }
.o-note.bad { color: var(--soon); }
.o-note.bad .o-text::before { content: "\26A0\FE0E\00A0"; }   /* a warning sign, not only a colour */
/* o-src: under the list, where its capes come from (capes.me), or why some may be missing */
.o-src { margin: -6px 0 0; font-size: var(--text-sm); color: var(--muted); }
.o-src:empty { display: none; }
.o-head { width: 32px; height: 32px; flex: none; image-rendering: pixelated; background: var(--slot); box-shadow: 0 0 0 2px var(--line); }
.nm { unicode-bidi: isolate; }   /* a player's or a cape's name inside a sentence, in any language */
.o-grid { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); }
@media (max-width: 420px) { .o-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } }   /* as the catalog */
.o-tile { display: grid; gap: 6px; align-content: start; justify-items: start; min-width: 0; }
.o-name { font-family: var(--font-pixel); font-weight: 600; font-size: 14px; line-height: 1.25; overflow-wrap: anywhere; max-width: 100%; }
.pill.wearing { color: var(--live); background: var(--live-bg); }
#owned-form .btn { min-height: calc(var(--text-sm) * 1.55 + 14px); }   /* as tall as the name box beside them */
/* "Choose capes": every cape with a box to tick, searchable, in a list that scrolls inside the window */
.pick { display: grid; gap: 12px; padding: 20px; }
.pick h3 { margin: 0; padding-inline-end: 40px; }
.pick-intro { margin: 0; color: var(--muted); font-size: var(--text-sm); }
.pick .field input { width: 100%; }
.pick-list { list-style: none; margin: 0; padding: 4px; display: grid; gap: 2px; align-content: start; height: min(46vh, 420px); overflow: auto;
  background: var(--bg); box-shadow: inset 2px 2px 0 var(--bevel-lo), inset -2px -2px 0 var(--bevel-hi); }
.pick-row { display: flex; align-items: center; gap: 10px; padding: 4px 8px; }
.pick-row:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.pick-thumb { width: 32px; height: 40px; flex: none; display: grid; place-items: center; overflow: hidden; background: var(--slot); color: var(--muted); }
.pick-thumb img { width: 100%; height: 100%; }
.pick-thumb svg { width: 40%; height: auto; shape-rendering: crispEdges; }
.pick-text { display: grid; gap: 4px; justify-items: start; min-width: 0; }   /* the name, and under it the badges */
.pick-name { font-family: var(--font-pixel); font-size: 14px; overflow-wrap: anywhere; }
.pick-none { padding: 12px; color: var(--muted); }
.pick-actions { display: flex; justify-content: flex-end; }

/* Detail dialog */
dialog { border: 0; padding: 0; max-width: min(560px, calc(100vw - 32px)); width: 100%; background: var(--panel); color: var(--fg);
  box-shadow: inset 3px 3px 0 var(--bevel-hi), inset -3px -3px 0 var(--bevel-lo), 0 20px 60px rgba(0,0,0,.35); }
dialog::backdrop { background: rgba(10, 12, 9, .55); }
.dlg { display: grid; grid-template-columns: 140px 1fr; gap: 18px; padding: 20px; }
@media (max-width: 480px) { .dlg { grid-template-columns: 1fr; } .dlg .slot { max-width: 160px; } }
.dlg-body { display: grid; gap: 10px; align-content: start; min-width: 0; padding-inline-end: 28px; }
/* Each fact: its label as a small line above the value, in every language (so Hebrew also reads the label first) */
.facts { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; font-size: var(--step--1); margin: 0; }
.facts dt { color: var(--muted); font-size: var(--text-sm); }
.facts dd + dt { margin-top: 8px; }
.facts dd { margin: 0; font-variant-numeric: tabular-nums; }
.dlg-close { position: absolute; top: 10px; right: 10px; }   /* fixed corners: the layout never mirrors */

footer { font-size: var(--text-sm); color: var(--muted); border-top: 2px solid var(--line); padding-top: 16px; display: grid; gap: 4px; }

/* Hebrew (the layout never mirrors): paragraphs run from the right of their box; short labels, numbers and headings
   sit on the left, next to what they belong to (the checkbox, the number, the value under them). */
[dir="rtl"]:is(.cw-opt span, .o-text, .o-src, .o-name, dt, dd, .stat b, .stat span, .countdown, .field label, legend, h2, h3, .eyebrow, .count-line, .lang-pick span, .cw-skin span, .cw-skin small) { text-align: left; }

/* ---------- Controls: one pixel feel for every button (approved on tools/buttons-demo.html) ----------
   Hover: a little brighter, soft green glow. Press: sinks 2px, darker, the bevel turns inward; back on release.
   Tab: a clear frame in the text colour. Disabled: grey, see-through, no hover. Checkboxes and switches (the
   app's settings) change with a short animation. 0.08-0.14s throughout. "Reduce animations": colours still
   change, nothing moves. Each control's resting bevel is --bs, so hover can add the glow on top of it. */
.btn, .view-reset, button.slot, select, .cw-box, .cw-switch {
  --glow: color-mix(in srgb, var(--accent) 55%, transparent);
  --ring: 0 0 0 1px var(--glow), 0 0 12px var(--glow);
  box-shadow: var(--bs);
  cursor: pointer;
